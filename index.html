<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoteFlow 線上聚餐時間投票</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-8 px-4">

  <div class="max-w-3xl mx-auto space-y-6">
    <!-- 標題卡片 -->
    <header class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 text-center">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-50 text-indigo-600 text-xs font-bold mb-3">
        <span>📅 VoteFlow 線上時間調查</span>
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900">聚會日期與時間投票</h1>
      <p class="text-slate-500 text-sm mt-2">請輸入您的姓名，並勾選所有「可以參加」的時段（可複選），送出後下方將即時更新統計結果。</p>
      <div id="syncStatus" class="mt-3 text-xs font-medium text-amber-600"></div>
    </header>

    <!-- 投票表單區 -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
      <form id="voteForm" class="space-y-6">
        <!-- 姓名輸入 -->
        <div>
          <label for="voterName" class="block text-sm font-bold text-slate-700 mb-2">
            您的姓名或暱稱 <span class="text-rose-500">*</span>
          </label>
          <input
            type="text"
            id="voterName"
            required
            placeholder="例如：王小明"
            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
          />
          <p class="text-xs text-slate-400 mt-1.5">💡 若需修改選項，輸入相同姓名重新送出即可覆蓋更新。</p>
        </div>

        <!-- 日期時間選項 -->
        <div>
          <div class="flex items-center justify-between mb-3">
            <label class="block text-sm font-bold text-slate-700">
              選擇可參加的時段（可複選） <span class="text-rose-500">*</span>
            </label>
            <div class="space-x-2 text-xs">
              <button type="button" onclick="toggleAll(true)" class="text-indigo-600 hover:underline font-medium">全選</button>
              <span class="text-slate-300">|</span>
              <button type="button" onclick="toggleAll(false)" class="text-slate-500 hover:underline">清除重選</button>
            </div>
          </div>

          <div id="optionsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <!-- 由 JS 動態生成 16 個選項 -->
          </div>
        </div>

        <!-- 送出按鈕 -->
        <button
          type="submit"
          id="submitBtn"
          class="w-full py-3.5 px-6 rounded-xl bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold text-base shadow-md shadow-indigo-200 transition cursor-pointer"
        >
          送出我的投票
        </button>
      </form>
    </section>

    <!-- 統計結果區 -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-6 border-b border-slate-100 pb-4">
        <div>
          <h2 class="text-xl font-bold text-slate-900">📊 即時統計結果</h2>
          <p class="text-xs text-slate-500 mt-1">自動標示目前最高票時段，點擊各列可查看投票名單</p>
        </div>
        <div class="bg-slate-100 px-4 py-2 rounded-xl text-sm font-bold text-slate-700">
          已投票人數：<span id="totalVoters" class="text-indigo-600 text-lg">0</span> 人
        </div>
      </div>

      <!-- 參與者總覽 -->
      <div class="mb-6">
        <div class="text-xs font-bold text-slate-500 mb-2">已填寫名單：</div>
        <div id="voterList" class="flex flex-wrap gap-2 text-xs">
          <span class="text-slate-400">尚無人投票</span>
        </div>
      </div>

      <!-- 長條圖統計列表 -->
      <div id="resultsList" class="space-y-4">
        <!-- 由 JS 動態生成統計長條 -->
      </div>
    </section>

    <footer class="text-center text-xs text-slate-400 pb-6">
      VoteFlow 線上投票系統 · 支援手機與電腦即時同步
    </footer>
  </div>

  <script>
    // ==========================================
    // 1. 指定 16 個日期時間選項
    // ==========================================
    const TIME_SLOTS = [
      "12/12 (六) 12:00",
      "12/12 (六) 18:00",
      "12/13 (日) 12:00",
      "12/13 (日) 18:00",
      "12/19 (六) 12:00",
      "12/19 (六) 18:00",
      "12/20 (日) 12:00",
      "12/20 (日) 18:00",
      "12/26 (六) 12:00",
      "12/26 (六) 18:00",
      "12/27 (日) 12:00",
      "12/27 (日) 18:00",
      "1/2 (六) 12:00",
      "1/2 (六) 18:00",
      "1/3 (日) 12:00",
      "1/3 (日) 18:00"
    ];

    // ==========================================
    // 2. 雲端資料庫設定 (填入 Firebase Realtime Database 網址即可多人同步)
    // 例如: "https://<專案ID>-default-rtdb.asia-southeast1.firebasedatabase.app"
    // ==========================================
    const FIREBASE_DB_URL = "https://voteflow-17847-default-rtdb.asia-southeast1.firebasedatabase.app";

    let votesData = {}; // 格式: { "王小明": { slots:, updatedAt: 1700000000 } }

    // 初始化選項卡片
    function renderOptions() {
      const grid = document.getElementById("optionsGrid");
      grid.innerHTML = TIME_SLOTS.map((slot, index) => {
        const isSaturday = slot.includes("(六)");
        const badgeColor = isSaturday ? "bg-sky-100 text-sky-700" : "bg-rose-100 text-rose-700";
        const dayText = isSaturday ? "週六" : "週日";
        return `
          <label class="relative flex items-center p-3.5 rounded-xl border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/40 cursor-pointer transition select-none">
            <input type="checkbox" name="timeSlot" value="${index}" class="w-5 h-5 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 mr-3">
            <span class="font-medium text-slate-800 flex-1">${slot}</span>
            <span class="text-[11px] font-bold px-2 py-0.5 rounded-md ${badgeColor}">${dayText}</span>
          </label>
        `;
      }).join("");
    }

    // 全選 / 清除
    function toggleAll(checked) {
      document.querySelectorAll('input[name="timeSlot"]').forEach(cb => cb.checked = checked);
    }

    // 讀取投票資料
    async function loadVotes() {
      const statusEl = document.getElementById("syncStatus");
      if (FIREBASE_DB_URL) {
        try {
          const cleanUrl = FIREBASE_DB_URL.replace(/\/$/, "");
          const res = await fetch(`${cleanUrl}/votes.json`);
          const data = await res.json();
          votesData = data || {};
          statusEl.textContent = "🟢 已連線雲端資料庫，所有人的投票即時同步中";
          statusEl.className = "mt-3 text-xs font-medium text-emerald-600";
        } catch (err) {
          console.error(err);
          statusEl.textContent = "🔴 雲端連線失敗，請檢查 Firebase 網址與權限設定";
          statusEl.className = "mt-3 text-xs font-medium text-rose-600";
        }
      } else {
        const local = localStorage.getItem("voteflow_data");
        votesData = local ? JSON.parse(local) : {};
        statusEl.textContent = "🟡 目前為本機預覽模式（填入 Firebase 網址即可開啟多人跨裝置同步）";
      }
      renderResults();
    }

    // 儲存投票資料
    async function saveVote(name, selectedIndices) {
      const payload = {
        slots: selectedIndices,
        updatedAt: Date.now()
      };

      if (FIREBASE_DB_URL) {
        const cleanUrl = FIREBASE_DB_URL.replace(/\/$/, "");
        const safeKey = encodeURIComponent(name);
        await fetch(`${cleanUrl}/votes/${safeKey}.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        await loadVotes();
      } else {
        votesData[name] = payload;
        localStorage.setItem("voteflow_data", JSON.stringify(votesData));
        renderResults();
      }
    }

    // 渲染統計結果
    function renderResults() {
      const voters = Object.keys(votesData);
      const totalVotersCount = voters.length;
      document.getElementById("totalVoters").textContent = totalVotersCount;

      // 渲染已填寫名單
      const voterListEl = document.getElementById("voterList");
      if (totalVotersCount === 0) {
        voterListEl.innerHTML = `<span class="text-slate-400">尚無人投票，快成為第一位吧！</span>`;
      } else {
        voterListEl.innerHTML = voters.map(name => `
          <span class="px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-700 font-medium border border-indigo-100">
            ${escapeHtml(name)} (${(votesData[name].slots || []).length}時段)
          </span>
        `).join("");
      }

      // 計算各時段得票數與名單
      const slotStats = TIME_SLOTS.map((label, idx) => {
        const supporters = voters.filter(name => (votesData[name].slots || []).includes(idx));
        return {
          index: idx,
          label,
          count: supporters.length,
          supporters
        };
      });

      // 找出最高票數
      const maxVotes = Math.max(...slotStats.map(s => s.count), 0);

      // 渲染長條圖
      const resultsListEl = document.getElementById("resultsList");
      resultsListEl.innerHTML = slotStats.map(stat => {
        const percent = totalVotersCount > 0 ? Math.round((stat.count / totalVotersCount) * 100) : 0;
        const isTop = maxVotes > 0 && stat.count === maxVotes;
        const barColor = isTop ? "bg-emerald-500" : "bg-indigo-500";
        const cardBorder = isTop ? "border-emerald-300 bg-emerald-50/30" : "border-slate-100 bg-slate-50/50";

        return `
          <div class="p-4 rounded-xl border ${cardBorder} transition">
            <div class="flex items-center justify-between text-sm mb-2">
              <div class="font-bold text-slate-800 flex items-center gap-2">
                <span>${stat.label}</span>
                ${isTop ? '<span class="px-2 py-0.5 text-[11px] rounded-full bg-emerald-500 text-white font-bold">👑 最高票</span>' : ''}
              </div>
              <div class="font-bold ${isTop ? 'text-emerald-700' : 'text-slate-700'}">
                ${stat.count} 票 <span class="text-xs font-normal text-slate-400">(${percent}%)</span>
              </div>
            </div>
            <div class="w-full h-2.5 rounded-full bg-slate-200 overflow-hidden">
              <div class="h-full rounded-full ${barColor} transition-all duration-500" style="width: ${percent}%"></div>
            </div>
            <details class="mt-2 text-xs text-slate-500">
              <summary class="cursor-pointer select-none hover:text-slate-700">查看投票名單</summary>
              <div class="mt-1.5">${stat.supporters.length ? stat.supporters.map(escapeHtml).join("、") : "尚無人選擇此時段"}</div>
            </details>
          </div>
        `;
      }).join("");
    }

    // 防止 XSS
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // 輸入相同姓名時，自動帶入先前的選項
    document.getElementById("voterName").addEventListener("change", (e) => {
      const existing = votesData[e.target.value.trim()];
      if (!existing) return;
      document.querySelectorAll('input[name="timeSlot"]').forEach(cb => {
        cb.checked = (existing.slots || []).includes(Number(cb.value));
      });
    });

    // 送出表單
    document.getElementById("voteForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("voterName").value.trim();
      const selected = [...document.querySelectorAll('input[name="timeSlot"]:checked')].map(cb => Number(cb.value));

      if (!name) {
        alert("請輸入姓名或暱稱");
        return;
      }
      if (selected.length === 0) {
        alert("請至少選擇一個可參加的時段");
        return;
      }

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "送出中...";
      try {
        await saveVote(name, selected);
        alert(`感謝 ${name}，您的投票已送出！`);
      } catch (err) {
        console.error(err);
        alert("送出失敗，請稍後再試");
      } finally {
        btn.disabled = false;
        btn.textContent = "送出我的投票";
      }
    });

    // 初始化
    renderOptions();
    loadVotes();
    if (FIREBASE_DB_URL) setInterval(loadVotes, 10000);
  </script>
</body>
</html>
